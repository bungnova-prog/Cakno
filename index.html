
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Cakno</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      text-align: center;
      padding: 50px 15px;
    }
    .kartu {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 20px #0001;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="kartu">
    <h1>Selamat Datang di Cakno!</h1>
    <p>Ini adalah website pertama saya.</p>
    <button onclick="alert('Website Cakno berhasil!')">
      Klik Saya
    </button>
  </div>
</body>
</html>
